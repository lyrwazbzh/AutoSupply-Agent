server:
  port: 8080

spring:
  application:
    name: java-erp
  datasource:
    url: jdbc:mysql://${ERP_DB_HOST:localhost}:${ERP_DB_PORT:3306}/${MYSQL_DATABASE:motorparts_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
  cache:
    type: redis
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

motorparts:
  security:
    enabled: ${ERP_SECURITY_ENABLED:true}
    cookie-secure: ${ERP_COOKIE_SECURE:false}
    jwt:
      issuer: ${ERP_JWT_ISSUER:java-erp}
      audience: ${ERP_JWT_AUDIENCE:erp-api,assistant-api,mcp}
      private-key-path: ${ERP_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${ERP_JWT_PUBLIC_KEY_PATH:}
      require-configured-key: ${ERP_JWT_REQUIRE_CONFIGURED_KEY:false}
      access-ttl-seconds: ${ERP_JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${ERP_REFRESH_TTL_SECONDS:604800}
    cors:
      enabled: ${ERP_CORS_ENABLED:false}
      allowed-origins: ${ERP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    login-rate-limit:
      max-attempts: ${ERP_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${ERP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  seed:
    enabled: false
  order-expiry:
    enabled: true
    pending-cancel-hours: 24
    poll-interval-ms: 5000
    batch-size: 20
  replenishment:
    enabled: ${ERP_REPLENISHMENT_ENABLED:true}
    cron: "${ERP_REPLENISHMENT_CRON:0 0 2 * * *}"
    zone: "${ERP_REPLENISHMENT_ZONE:Asia/Shanghai}"
    target-stock-multiplier: ${ERP_REPLENISHMENT_TARGET_MULTIPLIER:2}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,flyway,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.motorparts: INFO
