# ============================================================
# Harness 工作流声明式配置（DSL）
# 将 Planning → Executing → Review → Result 四阶段与评审标准
# 从 prompts.py 中抽离，实现"改流程不改代码"。
# ============================================================

# 阶段定义（顺序即流转顺序，label 用于前端展示）
phases:
  - name: planning
    label: "📝 规划中"
  - name: executing
    label: "⚙️ 执行中"
  - name: reviewing
    label: "🔍 审查中"
  - name: result
    label: "📊 已完成"

# 评审器配置（由 RubricMiddleware 消费）
review:
  mode: auto                 # auto / always / never；auto 对简单对话跳过 grader
  max_iterations: 3          # 单次 rubric 最多评审迭代次数
  model: null                # 使用主 LLM；可覆盖为 provider:model
  t_skip: 0.55               # 与跳过示例的最大余弦超过此值且高于 sim_grade 则跳过
  t_grade: 0.40              # 与需审查示例的最大余弦超过此值则审查（松于 t_type）
  t_type: 0.50               # 任务类型示例相似度门槛，平局落 default
  examples_need_review:
    - 查工厂下周缺料
    - 对比三家供应商交期
    - 这票货还要多久到
    - 这几家靠不靠谱
    - 列出低于安全库存的物料
    - 帮我做一份采购分析
  examples_skip_review:
    - 你好
    - 谢谢
    - 库存是什么意思
    - 什么是 MRP
    - 好的
    - 在吗

# 任务类型：keywords 精确子串；examples 供句向量选型（5～10 条）
task_types:
  analysis:
    keywords: [分析, 对比, 统计, 趋势, 报表, 图表, 报告, 评估]
    examples:
      - 分析近三个月采购金额趋势
      - 对比两家供应商的交期和价格
      - 出一份带图表的统计报表
      - 评估供货能力并给建议
  order:
    keywords: [下单, 采购, 订单, 新增, 修改, 审批, 创建]
    examples:
      - 创建一张采购订单
      - 修改订单数量后提交审批
      - 帮我下单物料 A 数量 100
  inventory:
    keywords: [库存, 入库, 出库, 盘点, 预警]
    examples:
      - 查一下安全库存预警
      - 办理入库和出库
      - 列出低于安全库存的料
  supplier:
    keywords: [供应商, 供货, 信用]
    examples:
      - 查供应商信用评级
      - 这几家供货能力怎么样
      - 筛选合作中的供应商
  mrp:
    keywords: [MRP, 缺料, 齐套, 净需求, 生产计划, 停线]
    examples:
      - 工厂下周缺料风险
      - 算齐套和净需求
      - 生产计划会不会停线
  sourcing:
    keywords: [RFQ, 询价, 报价, 定点, AVL, 认可供应商]
    examples:
      - 发 RFQ 询价
      - 按报价和 AVL 定点
      - 认可供应商清单
  delivery:
    keywords: [交付, ASN, 催交, 延期, 到货, 交期]
    examples:
      - 这票货还要多久到
      - 催交延期物料
      - 看 ASN 和交期
  quality:
    keywords: [PPAP, PPM, 质量, 来料, 不良, 审核]
    examples:
      - PPAP 放行了没有
      - 来料不良和 PPM
      - 质量审核结论

# 各任务类型的评审标准（"什么算完成"）
rubrics:
  default: |
    1. 完整回答用户的问题，未遗漏关键信息
    2. 所有数据均来自真实工具调用，未编造数据
    3. 输出使用 Markdown 格式，列表数据使用表格
    4. 金额保留两位小数，日期格式为 yyyy-MM-dd
    5. 结论有数据支撑，并给出可执行的建议

  analysis: |
    1. 使用 MCP 工具获取了真实业务数据（供应商/零部件/库存/订单）
    2. 对数据进行了清洗、汇总，提取出关键指标
    3. 输出了包含数据表格的结构化分析报告
    4. 生成了可视化图表（图表类型与数据类型匹配）
    5. 分析结论有明确的数据支撑，采购建议可执行

  order: |
    1. 提取了完整的订单字段（orderNumber、orderDetail、数量、单价）
    2. 缺失字段时通过 request_order_info 向用户询问，未擅自假设
    3. 数据校验通过：quantity >= 1，unitPrice > 0，partId 有效
    4. 创建/修改前向用户展示了完整订单摘要
    5. 写操作已触发人工审批中断，未绕过审批

  inventory: |
    1. 使用库存工具获取了真实库存数据
    2. 准确识别了低于安全库存的预警项
    3. 入库/出库操作的数据（partId、数量）完整且合法
    4. 输出包含库存状态总结与补货建议

  supplier: |
    1. 使用供应商工具获取了真实供应商数据
    2. 准确展示了信用评级、合作状态、供货能力
    3. 对比分析有明确的数据维度
    4. 给出了供应商选择或合作建议

  mrp: |
    1. 使用真实 MRP、库存、在途或生产计划工具数据，未编造缺料结论
    2. 明确项目、工厂、物料、需求日期、缺口和生产影响
    3. 区分库存、在途、未结订单和净需求，并给出可执行处置建议

  sourcing: |
    1. 使用真实报价、AVL、质量和交期数据进行定点或询源分析
    2. 明确比较维度、推荐供应商及其风险
    3. RFQ 创建或供应商定点等写操作已触发人工审批

  delivery: |
    1. 使用真实交付计划或交付绩效数据
    2. 明确延期物料、影响工厂/项目、需求日期及风险等级
    3. 给出催交、调拨、替代或排产协调建议，并说明前提条件

  quality: |
    1. 使用真实 PPAP、PPM、来料质量或审核数据
    2. 未将 PPAP 未放行或质量异常供应商描述为可直接量产使用
    3. 给出遏制、整改、复验或升级审批建议

# 可观测性配置
observability:
  trace_phase_transitions: true   # 是否持久化阶段流转 trace
