# ============================================================
# Harness 工作流声明式配置（DSL）
# 将 Planning → Executing → Review → Result 四阶段与评审标准
# 从 prompts.py 中抽离，实现"改流程不改代码"。
# ============================================================

# 阶段定义（顺序即流转顺序，label 用于前端展示）
phases:
  - name: planning
    label: "📝 规划中"
  - name: executing
    label: "⚙️ 执行中"
  - name: reviewing
    label: "🔍 审查中"
  - name: result
    label: "📊 已完成"

# 评审器配置（由 RubricMiddleware 消费）
review:
  mode: auto                 # auto / always / never；auto 统一使用规则优先、LLM 兜底
  router_timeout_seconds: 8  # 路由超时保守审查；独立调用最多一次，不自动重试
  max_iterations: 3          # 单次 rubric 最多评审迭代次数
  model: null                # 使用主 LLM；可覆盖为 provider:model

# 评审范围关键词（仅用于选择固定 rubric，不负责业务或工具分流）
task_types:
  shortage:
    keywords: [缺料, 齐套, 缺料风险, 短缺, 车型补货, 物料补货]
  analysis:
    keywords: [分析, 对比, 统计, 趋势, 报表, 图表, 报告, 评估]
  order:
    keywords: [下单, 采购, 订单, 新增, 修改, 审批, 创建]
  inventory:
    keywords: [库存, 入库, 出库, 盘点, 预警]
  supplier:
    keywords: [供应商, 供货, 信用]

# 各任务类型的评审标准（"什么算完成"）
rubrics:
  default: |
    1. 完整回答用户的问题，未遗漏关键信息
    2. 涉及业务事实时有真实工具证据；概念说明不强制调用 ERP
    3. 输出使用 Markdown 格式，列表数据使用表格
    4. 金额保留两位小数，日期格式为 yyyy-MM-dd
    5. 结论有依据，仅在用户要求时给出建议

  analysis: |
    1. 如需 ERP 数据，使用 MCP 工具获取；用户提供的数据标明来源
    2. 对数据进行了清洗、汇总，提取出关键指标
    3. 按用户要求的格式输出分析结果，不强制完整报告
    4. 仅当用户要求图表时检查图表生成及类型适配
    5. 分析结论有明确的数据支撑，采购建议可执行

  shortage: |
    1. 缺车型或工厂时先澄清，未擅自假设槽位
    2. 缺口、建议量、齐套率来自 verified_facts / verified_summary，回答含 calc_run_id 与口径版本
    3. 未对业务指标做模型心算或改数
    4. v2 按日峰值缺口处理延迟到货，MOQ 与包装倍数分离，风险日期可解释
    5. 涉及写单时已走人工审批；载荷摘要、有效期、供应商和价格来源未被修改
    6. 结论与工具证据、不可变计算记录一致

  order: |
    1. 提取了完整的订单字段（orderNumber、orderDetail、数量、单价）
    2. 缺失字段时通过 request_order_info 向用户询问，未擅自假设
    3. 数据校验通过：quantity >= 1，unitPrice > 0，partId 有效
    4. 创建/修改前向用户展示了完整订单摘要
    5. 写操作已触发人工审批中断，未绕过审批

  inventory: |
    1. 使用库存工具获取了真实库存数据
    2. 如任务涉及预警，准确识别低于安全库存的预警项
    3. 如涉及入库/出库，检查 partId、数量及审批信息
    4. 仅在用户要求时输出补货建议

  supplier: |
    1. 使用供应商工具获取了真实供应商数据
    2. 准确展示了信用评级、合作状态、供货能力
    3. 如涉及对比，分析有明确的数据维度
    4. 仅在用户要求时给出供应商选择或合作建议

# 可观测性配置
observability:
  trace_phase_transitions: true   # 是否持久化阶段流转 trace
